<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>⚔️ Claude's Dungeon — Solo D&D</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>⚔️ Claude's Dungeon</h1>
      <div class="controls">
        <button id="btn-new">New Campaign</button>
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
      </div>

      <div id="sheet" class="card">
        <div class="sheet-empty">No character yet. Begin a new campaign and the
          Dungeon Master will guide you through creation.</div>
      </div>

      <div id="dice-log" class="card">
        <h3>🎲 Dice Log</h3>
        <ul id="rolls"></ul>
      </div>

      <p class="hint">Powered by Claude · claude-opus-4-8 · running locally</p>
    </aside>

    <main id="main">
      <div id="log" aria-live="polite"></div>
      <form id="composer">
        <textarea id="input" rows="2" placeholder="What do you do?  (Enter to send · Shift+Enter for newline)" autofocus></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>

  <div id="modal" class="hidden">
    <div class="modal-box">
      <h3 id="modal-title">Load a campaign</h3>
      <div id="modal-body"></div>
      <button id="modal-close">Close</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
